[project]
name = "mde"
version = "0.1.0"
description = "Universal media discovery engine: catalogue, taxonomy, discovery API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mde*", "benchmark*"]

[tool.setuptools.package-data]
mde = ["migrations/*.sql", "taxonomy/*.json", "seed/*.json", "catalogue/*.json", "data/enrichment/*.json"]
benchmark = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"tests/enrichment_fixture.py" = ["E501"]
"mde/audit/engine.py" = ["E501"]
