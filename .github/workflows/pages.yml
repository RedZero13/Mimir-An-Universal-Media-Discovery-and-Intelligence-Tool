name: Deploy Mimir site

# Builds the static Mimir site (demo/build.cjs --site) and publishes it with GitHub Pages at the custom domain in
# its CNAME file (mimir.terratalesmedia.world). One-time setup: Settings → Pages → Source: GitHub Actions, plus the
# DNS record described in docs/DEPLOY.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node demo/build.cjs --site _site
        env:
          # Accounts and community switch on when the API is hosted: Settings → Secrets and variables → Actions →
          # Variables → MIMIR_API_URL (e.g. https://mimir-api.onrender.com). Empty keeps the site browser-only.
          MIMIR_API_URL: ${{ vars.MIMIR_API_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # After each deploy: confirm GitHub Pages enforces HTTPS and that a plain-http visit (an old bookmark, a device that
  # opened Mimir before HTTPS) is redirected to https. A failure here means Settings → Pages → Enforce HTTPS is off.
  verify-https:
    needs: deploy
    runs-on: ubuntu-24.04
    permissions:
      pages: read
    steps:
      - name: Pages settings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/pages" --jq '{cname, https_enforced, status, https_certificate: .https_certificate.state}'
      - name: http redirects to https
        run: |
          sleep 30
          for path in / /blog/ /sw.js; do
            echo "== http://mimir.terratalesmedia.world$path"
            curl -sSI "http://mimir.terratalesmedia.world$path" | grep -iE '^(HTTP|location|cache-control)'
          done
          code=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' http://mimir.terratalesmedia.world/)
          echo "result: $code"
          case "$code" in 301\ https://*|308\ https://*) echo "OK: http is redirected to https" ;; *) echo "::error::http is not redirected to https ($code)"; exit 1 ;; esac
