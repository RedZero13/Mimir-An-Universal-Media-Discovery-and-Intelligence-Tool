name: Deploy Mimir site

# Builds the static Mimir site (demo/build.cjs --site) and publishes it with GitHub Pages at the custom domain in
# its CNAME file (mimir.terratalesmedia.world). One-time setup: Settings → Pages → Source: GitHub Actions, plus the
# DNS record described in docs/DEPLOY.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node demo/build.cjs --site _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
