# Render blueprint for the Mimir API and its database (New → Blueprint, pick this repository).
# The static site stays on GitHub Pages; set the repository variable MIMIR_API_URL to this service's URL.
services:
  - type: web
    name: mimir-api
    runtime: docker
    rootDir: api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mimir-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://mimir.terratalesmedia.world
databases:
  - name: mimir-db
    databaseName: mimir
